apiVersion: v1
kind: Namespace
metadata: {name: solarops}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: app-db, namespace: solarops}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio, namespace: solarops}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 8Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: airflow-db, namespace: solarops}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: solarops-data, namespace: solarops}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 8Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-db, namespace: solarops}
spec:
  replicas: 1
  selector: {matchLabels: {app: app-db}}
  template:
    metadata: {labels: {app: app-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.10-bookworm
          env:
            - {name: POSTGRES_USER, value: solarops}
            - {name: POSTGRES_DB, value: solarops}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: solarops-infra, key: APP_DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, solarops]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: app-db}}]
---
apiVersion: v1
kind: Service
metadata: {name: app-db, namespace: solarops}
spec: {selector: {app: app-db}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: airflow-db, namespace: solarops}
spec:
  replicas: 1
  selector: {matchLabels: {app: airflow-db}}
  template:
    metadata: {labels: {app: airflow-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.10-bookworm
          env:
            - {name: POSTGRES_USER, value: airflow}
            - {name: POSTGRES_DB, value: airflow}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: solarops-infra, key: AIRFLOW_DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, airflow]}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: airflow-db}}]
---
apiVersion: v1
kind: Service
metadata: {name: airflow-db, namespace: solarops}
spec: {selector: {app: airflow-db}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: solarops}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: solarops-minio:2025-10-15-pinned
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: solarops-infra, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: solarops-infra, key: MINIO_ROOT_PASSWORD}}
          ports: [{containerPort: 9000}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: solarops}
spec: {selector: {app: minio}, ports: [{port: 9000}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: solarops-worker, namespace: solarops}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: solarops-pod-launcher, namespace: solarops}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create, get, list, watch, delete, patch]
  - apiGroups: ['']
    resources: [pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: solarops-pod-launcher, namespace: solarops}
subjects: [{kind: ServiceAccount, name: airflow-scheduler, namespace: solarops}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: solarops-pod-launcher}
