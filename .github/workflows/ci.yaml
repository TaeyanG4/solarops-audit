name: SolarOps checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOLAROPS_DATA_DIR: data/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.29", python-version: "3.12"}
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts dags
      - run: uv run ruff format --check src tests scripts dags
      - run: node --check src/solarops/api/static/dashboard.js
      - run: uv run pytest -q --junitxml=artifacts/pytest.xml
      - run: uv run solarops demo
      - run: uv run python scripts/portfolio_demo.py --output data/ci/portfolio-demo
      - run: uv build --wheel --out-dir artifacts/dist
      - run: git diff --exit-code uv.lock
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.os }}
          path: |
            data/ci/reports/
            data/ci/portfolio-demo/evidence.json
            data/ci/portfolio-demo/reports/
            artifacts/pytest.xml
            artifacts/dist/
          retention-days: 7
