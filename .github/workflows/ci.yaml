name: SolarOps checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOLAROPS_DATA_DIR: data/ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with: {version: "0.11.29", python-version: "3.12"}
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts dags
      - run: uv run ruff format --check src tests scripts dags
      - run: node --check src/solarops/api/static/dashboard.js
      - run: uv run python scripts/validation/check_docs.py
      - run: uv run pytest -q --junitxml=artifacts/pytest.xml
      - run: uv run solarops demo
      - run: uv run python scripts/demo/portfolio_demo.py --output data/ci/portfolio-demo
      - run: uv run python scripts/validation/backup_restore_drill.py --output data/ci/restore-drill
      - run: uv build --wheel --out-dir artifacts/dist
      - run: uv run python scripts/release/package_source.py --output artifacts/source.zip
      - run: git diff --exit-code uv.lock
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-demo-${{ matrix.os }}
          path: |
            data/ci/reports/
            data/ci/portfolio-demo/evidence.json
            data/ci/portfolio-demo/reports/
            data/ci/restore-drill/evidence.json
            data/ci/restore-drill/backup-manifest.json
            artifacts/pytest.xml
            artifacts/dist/
            artifacts/source.zip
          retention-days: 7
