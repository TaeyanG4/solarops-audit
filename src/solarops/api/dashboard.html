<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarOps Audit</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f0;font:14px/1.5 'Segoe UI',sans-serif;color:#163b2f}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#113c30;color:#d7e4dc;padding:28px 22px;position:sticky;top:0;height:100vh}h2{color:#dcf58b;font-size:24px;letter-spacing:-1px;margin:0 0 5px}.sub{font-size:11px;color:#9cbaa9;letter-spacing:2px}nav{margin-top:42px}button,select{font:inherit}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#c4d9ca;padding:13px 14px;border-radius:7px;cursor:pointer;margin:4px 0}nav button.active{background:#2e5a42;color:#e3f8aa}.foot{position:absolute;bottom:30px;font-size:12px;color:#9cbaa9}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce3d9;padding:18px 28px;background:#fff;gap:12px}.top span{color:#6c7f70;font-size:12px}select{padding:8px;border:1px solid #d3dcca;border-radius:5px;background:#fafbf7;max-width:350px}iframe{width:100%;height:calc(100vh - 76px);border:0}.content{padding:28px}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #e5eadd}th{font-size:12px;color:#64776a}.empty{padding:60px;color:#627567}.badge{display:inline-block;color:#b9dd8e;font-size:12px;border:1px solid #507359;border-radius:20px;padding:4px 10px;margin-top:18px}svg{width:100%;height:260px;background:white;border:1px solid #dce3d9;border-radius:8px}.legend{display:flex;gap:20px;margin:12px 0}.legend b{color:#13664f}.legend i{color:#c18a24;font-style:normal}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:15px}nav{display:flex;margin-top:12px}nav button{width:auto}.foot,.badge{display:none}.top{padding:12px;flex-wrap:wrap}}</style></head><body><div class="shell"><aside><h2>☀ solarops</h2><div class="sub">AUDIT WORKSPACE</div><nav><button class="active" data-view="reports">▤　월간 리포트</button><button data-view="plants">◉　발전소 현황</button><button data-view="runs">↻　실행 이력</button></nav><div class="badge">● Local · Read only</div><div class="foot">검토 근거가 남는 운영 보고<br>Historical data · v0.1</div></aside><main><div class="top"><b id="title">월간 리포트</b><select id="reportSelect" aria-label="보고서 선택"></select><span>UTC · 추정 발전량 / 검토 대상</span></div><div id="view"></div></main></div><script>
const view=document.querySelector('#view'), selector=document.querySelector('#reportSelect');let reports=[];
function el(tag,text){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}async function get(url){let r=await fetch(url);if(!r.ok)throw Error('조회 실패: '+r.status);return r.json()}
function report(){view.replaceChildren();let r=reports[selector.value];if(!r){view.append(el('p','아직 보고서가 없습니다. solarops demo 실행 후 새로고침하세요.'));return}let frame=el('iframe');frame.title='월간 보고서';frame.src='/reports/'+encodeURIComponent(r.report_id)+'/report.html';view.append(frame)}
function table(headers,rows){let t=el('table'),tr=el('tr');for(let h of headers)tr.append(el('th',h));t.append(tr);for(let row of rows){let tr=el('tr');for(let value of row){let td=el('td');value instanceof Node?td.append(value):td.textContent=value??'—';tr.append(td)}t.append(tr)}return t}
async function plants(){let data=await get('/api/v1/plants?limit=100');let box=el('div');box.className='content';box.append(el('h1','발전소 현황'));let rows=[];for(let p of data.items){let m=await get('/api/v1/plants/'+encodeURIComponent(p.plant_id)+'/metrics?limit=1');let b=el('button','시계열 보기');b.onclick=async()=>{let last=await get('/api/v1/plants/'+encodeURIComponent(p.plant_id)+'/metrics?limit=1&offset='+Math.max(0,m.total-1));detail(p.plant_id,last.items[0]?.local_date)};rows.push([p.plant_id,Number(p.nominal_power_kw).toLocaleString()+' kW',m.total+'일',p.brazil_federative_unit,b])}box.append(table(['발전소','설비 용량','등록 기간','지역','관측 자료'],rows));view.replaceChildren(box)}
async function detail(plant,day){if(!day)return;let data=await get('/api/v1/plants/'+encodeURIComponent(plant)+'/series?day='+day);let box=el('div');box.className='content';box.append(el('h1',plant+' · '+day));let p=el('p','관측 전력과 일사량 · UTC · 서로 다른 축으로 정규화해 표시합니다.');box.append(p);const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 260');let items=data.items;for(let [key,color] of [['power_kw','#13664f'],['poa_wm2','#c18a24']]){let max=Math.max(1,...items.map(r=>r[key]||0)),pts=[];function draw(){if(pts.length){let line=document.createElementNS(ns,'polyline');line.setAttribute('points',pts.join(' '));line.setAttribute('stroke',color);line.setAttribute('stroke-width','2');line.setAttribute('fill','none');svg.append(line);pts=[]}}items.forEach((r,i)=>{if(r[key]===null){draw();return}pts.push((20+i*960/Math.max(1,items.length-1))+','+(235-r[key]/max*210))});draw()}box.append(svg);let legend=el('div');legend.className='legend';legend.append(el('b','● 전력 kW'),el('i','● POA W/m²'));box.append(legend,table(['UTC','전력 kW','POA W/m²','데이터 판단'],items.map(r=>[r.ts_utc,r.power_kw?.toFixed(2),r.poa_wm2?.toFixed(1),r.assessment])));view.replaceChildren(box)}
async function runs(){let data=await get('/api/v1/runs?limit=100');let box=el('div');box.className='content';box.append(el('h1','실행 이력'),table(['실행 ID','발전소','날짜','상태','오류'],data.items.map(r=>[r.run_id.slice(0,8),r.plant_id,r.partition_id||r.from,r.status,r.error_code])));view.replaceChildren(box)}
selector.onchange=report;document.querySelectorAll('nav button').forEach(b=>b.onclick=async()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#title').textContent=b.textContent.trim();selector.hidden=b.dataset.view!=='reports';try{await({reports:report,plants,runs}[b.dataset.view])()}catch(e){view.replaceChildren(el('p',e.message))}});
get('/api/v1/reports').then(data=>{reports=data.items;reports.sort((a,b)=>b.generated_at.localeCompare(a.generated_at));reports.forEach((r,i)=>{let o=el('option',r.period+' · '+r.scope+' · '+(r.status==='complete'?'월 전체':'부분 기간'));o.value=i;selector.append(o)});report()}).catch(e=>view.replaceChildren(el('p',e.message)));
</script></body></html>
