<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="태양광 역사 자료의 품질, 처리 이력, 보고서 출처를 확인하는 읽기 전용 워크스페이스"
    />
    <title>SolarOps Audit · 운영 데이터 감사</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
    <script src="/static/dashboard.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#view">본문으로 건너뛰기</a>
    <div class="shell">
      <aside>
        <a class="brand" href="/" aria-label="SolarOps 처음으로"
          ><span class="sun">☀</span> solarops<span class="brand-dot"
            >.</span
          ></a
        >
        <p class="wordmark">OPERATIONS / AUDIT</p>
        <nav aria-label="주 메뉴">
          <button data-view="overview"><span>◫</span> 전체 현황</button>
          <button data-view="reports"><span>▤</span> 월간 보고서</button>
          <button data-view="runs"><span>↻</span> 실행 이력</button>
        </nav>
        <div class="sidebar-note">
          <span class="live-dot"></span> 로컬 · 읽기 전용
          <p>결과에서 원본까지.<br />검토 근거가 남는 데이터.</p>
          <a href="/docs" target="_blank" rel="noopener">API 문서 ↗</a>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <span class="eyebrow">SOLAROPS WORKSPACE</span>
            <p id="breadcrumb">전체 현황</p>
          </div>
          <span class="tag">HISTORICAL DATA</span>
        </header>
        <div class="toolbar" id="scope-controls">
          <label
            >보고 월<input
              type="month"
              id="period"
              value="2024-04"
              min="1900-01"
              max="2199-12"
              required
          /></label>
          <label
            >자료 구분<select id="source">
              <option value="all">전체 · 합성 포함</option>
              <option value="public">BR-PVGen 공개 자료</option>
              <option value="synthetic">합성 데모</option>
            </select></label
          >
          <button id="refresh" class="secondary">↻ 새로고침</button>
          <span class="toolbar-note">15분 역사 자료 · 발전량은 추정치</span>
        </div>
        <div id="view" tabindex="-1" aria-live="polite" aria-busy="false"></div>
        <footer>
          SolarOps Audit <span id="version"></span
          ><span>관측 품질과 판단 가능한 범위를 함께 확인합니다.</span>
        </footer>
      </main>
    </div>
  </body>
</html>
