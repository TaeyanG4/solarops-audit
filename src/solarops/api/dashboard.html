<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="태양광 역사 자료의 품질, 처리 이력, 보고서 출처를 확인하는 읽기 전용 워크스페이스"
    />
    <title>SolarOps Audit · 운영 데이터 감사</title>
    <link rel="stylesheet" href="/static/dashboard.css?v=overview-20261023" />
    <script src="/static/dashboard.js?v=overview-20261023" defer></script>
  </head>
  <body>
    <a class="skip" href="#view">본문으로 건너뛰기</a>
    <div class="shell">
      <aside>
        <a class="brand" href="/" aria-label="SolarOps 처음으로">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 23 12 9h8l6 14H6Z M9 17h14 M16 9v14" />
            <path d="M16 2v3 M5 6l3 3 M27 6l-3 3" />
          </svg>
          SolarOps<span class="brand-dot">/</span>
        </a>
        <p class="wordmark">운영 데이터 감사</p>
        <nav aria-label="주 메뉴">
          <button data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"
              /></svg
            >전체 현황
          </button>
          <button data-view="reports">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7" /></svg
            >월간 보고서
          </button>
          <button data-view="runs">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8a9 9 0 1 1-1 6 M4 3v5h5 M12 7v5l3 2" /></svg
            >실행 이력
          </button>
        </nav>
        <div class="sidebar-note">
          <strong>로컬 워크스페이스</strong>
          <p>읽기 전용 · 역사 자료<br />결과에서 원본까지 추적합니다.</p>
          <a href="/docs" target="_blank" rel="noopener">API 문서 ↗</a>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <span class="workspace-label"
              >워크스페이스 <span aria-hidden="true">/</span></span
            >
            <p id="breadcrumb">전체 현황</p>
          </div>
          <span class="tag">역사 자료 · 읽기 전용</span>
        </header>
        <div class="toolbar" id="scope-controls">
          <label
            >보고 월<input
              type="month"
              id="period"
              value="2024-04"
              min="1900-01"
              max="2199-12"
              required
          /></label>
          <label
            >자료 구분<select id="source">
              <option value="all">전체 · 합성 포함</option>
              <option value="public">BR-PVGen 공개 자료</option>
              <option value="synthetic">합성 데모</option>
            </select></label
          >
          <button id="refresh" class="secondary">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7a9 9 0 1 0 1 8 M20 3v5h-5" /></svg
            >새로고침
          </button>
          <span class="toolbar-note">15분 간격 · UTC 기준</span>
        </div>
        <div id="view" tabindex="-1" aria-live="polite" aria-busy="false"></div>
        <footer>
          SolarOps Audit <span id="version"></span
          ><span>관측 품질과 판단 가능한 범위를 함께 확인합니다.</span>
        </footer>
      </main>
    </div>
  </body>
</html>
